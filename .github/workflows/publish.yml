name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a publish or let two runs race to publish the same version.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/build.yml

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11

      - name: Check whether this version is published
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const spec = `${name}@${version}`;
          const result = spawnSync('npm', ['view', spec, 'version', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' });
          if (result.error) throw result.error;
          const response = JSON.parse(result.stdout || '{}');
          if (result.status === 0 && response === version) {
            console.log(`${spec} is already published; skipping.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          } else if (result.status !== 0 && response.error?.code === 'E404') {
            console.log(`${spec} is not published yet.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else {
            console.error(result.stderr || result.stdout || `npm view exited with ${result.status}`);
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # prepublishOnly reruns the complete validation gate and builds this checkout.
      - name: Publish with npm trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
